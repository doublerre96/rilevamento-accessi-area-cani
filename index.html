<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area Cani - Check-in</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 22px;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        p {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-danger {
            background-color: #e74c3c;
            margin-top: 15px;
        }

        /* Schermata Timer (Nascosta all'inizio) */
        #timer-screen {
            display: none;
        }

        .timer-display {
            font-size: 48px;
            font-weight: bold;
            color: #2c3e50;
            margin: 20px 0;
            letter-spacing: 2px;
            background: #eef9f2;
            padding: 15px;
            border-radius: 15px;
            border: 2px dashed #2ecc71;
        }

        .status-badge {
            display: inline-block;
            background-color: #e8f8f5;
            color: #27ae60;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        
        <!-- Vista 1: Conferma Ingresso -->
        <div id="checkin-screen">
            <div class="icon">🐾</div>
            <h1>Area Cani Parco Nord</h1>
            <p>Sei all'ingresso. Conferma la presenza per iniziare il tuo slot da 15 minuti e informare gli altri utenti.</p>
            <button class="btn" onclick="startSession()">Conferma Ingresso</button>
        </div>

        <!-- Vista 2: Timer Attivo -->
        <div id="timer-screen">
            <span class="status-badge">● DENTRO L'AREA CANI</span>
            <h1>Slot In Corso</h1>
            <p>Tempo rimanente prima del termine del tuo turno:</p>
            
            <div class="timer-display" id="timer">15:00</div>

            <button class="btn btn-danger" onclick="endSession()">Esci dall'Area Cani</button>
        </div>

    </div>

    <script>
        let countdown;
        // Imposta la durata dello slot (15 minuti in secondi)
        const SLOT_DURATION = 15 * 60; 

        function startSession() {
            // Passa dalla schermata di conferma a quella del timer
            document.getElementById('checkin-screen').style.display = 'none';
            document.getElementById('timer-screen').style.display = 'block';

            let timeLeft = SLOT_DURATION;
            updateTimerDisplay(timeLeft);

            // Avvia l'orologio (scende di 1 secondo alla volta)
            countdown = setInterval(() => {
                timeLeft--;
                updateTimerDisplay(timeLeft);

                // Quando il tempo scade
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    alert("I 15 minuti sono terminati! Prolunga il tempo o libera l'area se ci sono altri cani in attesa.");
                    endSession();
                }
            }, 1000);
        }

        function updateTimerDisplay(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remainderSeconds = seconds % 60;
            
            // Format come 05:09 invece di 5:9
            const display = `${minutes < 10 ? '0' : ''}${minutes}:${remainderSeconds < 10 ? '0' : ''}${remainderSeconds}`;
            document.getElementById('timer').textContent = display;
        }

        function endSession() {
            // Ferma l'orologio e resetta la vista
            clearInterval(countdown);
            document.getElementById('timer-screen').style.display = 'none';
            document.getElementById('checkin-screen').style.display = 'block';
        }
    </script>
</body>
</html>
